baseURL = 'https://www.alexiscouvreur.fr/'
theme = 'ananke'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'

# Every page also renders a bare 1200x630 card at <page>/og.html, which
# tools/ogimages screenshots into the og.png referenced by the meta tags.
[outputFormats]
  [outputFormats.ogcard]
    mediaType = 'text/html'
    baseName = 'og'
    isHTML = true
    notAlternative = true

[outputs]
  home = ['html', 'rss', 'ogcard']
  section = ['html', 'rss', 'ogcard']
  page = ['html', 'ogcard']

[languages]

  [languages.en]
    locale = 'en-us'
    title = 'Alexis Couvreur'
    weight = 1

    [languages.en.params]
      background_color_class = 'bg-white'
      body_classes = 'bg-white'
      author = 'Alexis Couvreur'
      description = 'Software engineer in Montreal. DevOps, Kubernetes, Go and open source.'

      [languages.en.params.ananke]
        # fonts.html is a partial that generates @font-face rules; it must come
        # first so the faces are declared before anything uses them.
        custom_css = ['fonts.html', 'palette-blue.css', 'alexis.css']
        show_recent_posts = false

        [languages.en.params.ananke.social.follow]
          networks = ['github', 'linkedin', 'x-twitter', 'rss']

        [languages.en.params.ananke.social.github]
          username = 'acouvreur'

        [languages.en.params.ananke.social.linkedin]
          username = 'alexis-couvreur'

        [languages.en.params.ananke.social.x-twitter]
          username = 'Zittoone'

        [languages.en.params.ananke.social.rss]
          profilelink = '/blog/index.xml'

    [[languages.en.menus.main]]
      name = 'Resume'
      url = '/resume/'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Open Source'
      url = '/opensource/'
      weight = 20
    [[languages.en.menus.main]]
      name = 'Talks'
      url = '/talks/'
      weight = 25
    [[languages.en.menus.main]]
      name = 'Blog'
      url = '/blog/'
      weight = 30

[caches]
  [caches.images]
    dir = ':cacheDir/images'
