<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l mw8 center items-center justify-between">
    <a href="{{ .Site.Home.RelPermalink }}" class="ac-brand dib no-underline">
      {{ .Site.Title }}
    </a>
    <div class="flex-l items-center">
      {{ if .Site.Menus.main }}
        <ul class="{{ compare.Conditional (compare.Eq $.Site.Language.Direction "rtl") "pr0 ml3" "pl0 mr3" }}" style="margin:0; padding:0;">
          {{ range .Site.Menus.main }}
          <li class="list f5 dib {{ compare.Conditional (compare.Eq $.Site.Language.Direction "rtl") "pl3" "pr3" }}">
            <a class="no-underline ac-nav-link{{ if $.IsMenuCurrent "main" . }} ac-nav-link--active{{ else if $.HasMenuCurrent "main" . }} ac-nav-link--active{{ end }}" href="{{ .URL }}" title="{{ lang.Translate "pageTitle" . }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      {{ partials.IncludeCached "social/follow.html" . }}
    </div>
  </div>
</nav>
