[tools]
hugo = "0.163.1"
go = "1.22"

[tasks.contributions]
description = "Regenerate data/opensource.json from the GitHub API"
run = "go run ./tools/contributions/main.go"

[tasks.build]
description = "Build the site the way CI does"
run = "hugo --gc --minify"

[tasks.og]
description = "Render the social preview cards into public/ (needs a build first)"
run = "go run ./tools/ogimages"

[tasks.pdf]
description = "Print the resume page to a PDF in public/ (needs a build first)"
run = "go run ./tools/resumepdf"

[tasks.dist]
description = "Everything CI produces: the site, the social cards and the resume PDF"
depends = ["build"]
run = ["go run ./tools/ogimages", "go run ./tools/resumepdf"]

[tasks.dev]
description = "Serve locally, including drafts"
run = "hugo server -D"
