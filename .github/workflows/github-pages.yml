name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the scheduled contributions update redeploy after it pushes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # No install_args, so this installs everything mise.toml pins: Hugo, Go
      # and Node.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # Before Hugo: the decks land in static/slides/, so Hugo publishes them and
      # the talks page can see which ones exist. Marp drives the same Chrome as
      # the two steps after the build.
      - name: Build talk slides
        run: |
          npm ci --no-audit --no-fund
          go run ./tools/slides

      - name: Build site
        run: hugo --gc --minify
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_BASEURL: "${{ steps.pages.outputs.base_url }}/"

      # Both of these drive the Chrome preinstalled on the runner and write into
      # public/, so their output ships inside the Pages artifact.
      - name: Render social cards
        run: go run ./tools/ogimages

      - name: Print resume to PDF
        run: go run ./tools/resumepdf

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    # Pages refuses a deployment while another is in progress, so a burst of
    # merges used to fail all but one. Deploys now queue: the running one is
    # never cancelled, and a newer pending deploy replaces an older one, since
    # only the latest commit needs to go out.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
