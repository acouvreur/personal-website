name: Links

on:
  # Weekly rather than per-push. These links rot on their own schedule, not on
  # the repository's, and a dead devpost URL should not block a deploy.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "data/**"
      - "content/**"
      - "layouts/**"
      - "lychee.toml"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "hugo"

      # Not minified: lychee's parser loses track of the minified markup's
      # unquoted attributes and silently skips almost every link after them.
      - name: Build site
        run: hugo --gc
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache

      # root-dir resolves the site's root-relative links (/resume/, /favicon.svg)
      # against the build, and has to be absolute, so it cannot live in lychee.toml.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir '${{ github.workspace }}/public' './public/**/*.html'
          fail: false
          output: lychee-report.md

      # A broken link is a chore, not an incident. On the weekly run it files or
      # updates a single issue; on a pull request the step summary is enough.
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken links on the site
          content-filepath: lychee-report.md
          labels: chore

      - name: Fail the pull request if links are broken
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
